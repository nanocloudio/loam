# Loam project config consumed by the `fluxor` CLI. Declares loam's
# cross-project dependencies: fluxor (SDK + runtime) and clustor (the Raft substrate
# whose fmod palette the composed metadata-plane profiles run against).

[project]
name    = "loam"
version = "0.0.1"

[dependencies]
fluxor  = "0.0.1"
clustor = "0.0.1"
# wave owns the S3 protocol tier: the `s3` module plus the wave-common
# source artefact (SigV4 signing, S3 wire records).
wave    = "0.0.1"

[ci]
targets = ["bcm2712"]
[ci.hygiene]
# Tiers where inline tests are banned: PIC modules are no_std (test
# code can't even compile there) and src/ keeps tests in tests/
# (enforced by `fluxor lint hygiene`).
forbid_inline_tests = ["modules", "src"]
mode                = "strict"

# Crate-root suppressions, per standards/lints.md §4. Each prefix names
# ONE cause, and every file under it was checked to need the attribute:
# a suppression that no longer fired was deleted rather than kept, so
# these cover live causes only.

[[ci.hygiene.allow_crate_root]]
prefix = "modules/app/"
reason = """A PIC module mounts the SDK runtime and params by include!, so its \
compile sees the whole generated surface — define_params! emits parse_tlv and \
dispatch_param into every module whether it takes params or not. The unused \
items are not in the module's own source, so there is no item to move the \
attribute onto: it is a property of how a PIC module is built."""

[[ci.hygiene.allow_crate_root]]
prefix = "modules/common/"
reason = """Shared step bodies and wire vocabularies, #[path]-mounted into several \
PIC modules and into the host crates and tests. Each consumer uses a different \
subset, so an item dead in one consumer is live in another. A per-item \
#[expect] cannot express that — it errors in every consumer where the item is \
used — and a per-item #[allow] on several hundred items would say less than one \
statement of what these files are."""

[[ci.hygiene.allow_crate_root]]
prefix = "tests/common/"
reason = """The PIC harness, #[path]-mounted into every test crate. Each suite \
drives the channels and syscalls it needs and none drives all of them — the \
same multi-consumer cause as modules/common/, on the test side."""

[ci.test]
# Shadow-checkout hard-fail guard:
# tests/ and examples/ are shadow-tracked in .git-shadow/, so a
# checkout of the primary repo alone has zero files there — the cargo
# test phases would pass vacuously and the e2e would have no graph to
# boot. The guard fails CI instead.
#
# `s3_driven.sh` is the connector's behavioural gate: it stands up loam's own
# `--s3-listen` gateway and drives PUT/GET/HEAD/DELETE through the s3_client
# graph, chosen at runtime and signed per request, then reads the object back
# with curl INDEPENDENTLY of the connector. The host vectors in
# `tests/s3_wire_core.rs` pin the framing and the signature; this pins that a
# real endpoint accepts them.
# `tier_guard.sh` enforces the storage tier boundary: mechanics vs
# replicated rosters, no upward common/ reach, no clustor from the
# mechanics tier.
# `metadata_load.sh` drives the replicated metadata plane under offered
# load and gates on conservation — every record the plane accepts is
# either committed or refused, never dropped. Host tests cover the
# splitting logic; only a real graph under load covers the seams
# between the modules that carry it.
# `composed_node.sh` puts a public surface on that plane in one graph and
# gates both conservation claims at once: every proposal resolved, and
# every request answered. It also runs a module the way a module is
# actually run — loaded, at an address it was not linked for — which is
# the one thing no host test can do.
# `body_publication.sh` gates the fence the body store negotiates from a
# live filesystem provider, and that the artefact lands under it with no
# staging file beside it. Host tests present synthetic capability
# bitmaps; only a real graph shows the bitmap a real provider returns.
scripts = [
  "tools/ci/shadow_guard.sh",
  "tools/ci/tier_guard.sh",
  "tools/ci/limit_guard.sh",
  "tools/ci/profile_matrix.sh",
  "tools/e2e/s3_driven.sh",
  "tools/e2e/metadata_load.sh",
  "tools/e2e/composed_node.sh",
  "tools/e2e/body_publication.sh",
]

[ci.cargo]
# Loam is a plain host workspace (no embedded-only root features):
# the cargo-test phase runs at the project root and covers every
# workspace member via default-members.
host_tools_crate = "."
