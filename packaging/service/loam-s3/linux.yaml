# The loam-s3 service graph: S3 over a single loam storage node.
#
#   linux_net ⇄ http ⇄ s3_serve ── storage.object ──▶ node (loam-node)
#
# `node` is loam's storage node, included from its stack
# (packaging/stack/loam-node.yaml): the `storage.object` provider, the
# admin plane behind it, the namespace, the object index and the body
# store. `s3_serve` calls the object surface and the node's provider
# answers it, presenting each access key's capability to the node's gate
# on a session of its own. The node's exchange front is left unwired and
# given no capability, so it answers nothing: S3 is this graph's only door.
target: linux
tick_us: 100

# `linux_net` ⇄ `http` ⇄ `s3_serve`, and every admin-plane pair inside
# the node, are request/response cycles by construction.
scheduler:
  accept_cycles: true

platform:
  net: {}

params:
  port:
    type: integer
    default: 9000
    min: 1
    max: 65535
    description: TCP port the S3 endpoint listens on
  credentials:
    type: string
    required: true
    example: /etc/loam/s3-credentials
    description: "Path of the credentials file: access key, secret, scope and capability per line"
  mesh_roots:
    type: string
    required: true
    example: "3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c"
    description: "Mesh root keys the capabilities verify against: one or two 64-hex Ed25519 keys, comma-separated"
  region:
    type: string
    default: us-east-1
    description: Region requests must be signed for
  max_object_mib:
    type: integer
    default: 1024
    min: 1
    max: 1024
    description: "Largest object accepted, MiB; a loam object is at most 1 GiB"
  part_min_kib:
    type: integer
    default: 5120
    min: 0
    max: 1048576
    description: "Smallest multipart part but the last, KiB"
  ns_wal:
    type: string
    required: true
    example: /var/lib/loam/ns.wal
    description: "The namespace's write-ahead log; its snapshots live beside it"
  obj_wal:
    type: string
    required: true
    example: /var/lib/loam/obj.wal
    description: "The object index's write-ahead log"
  body_dir:
    type: string
    required: true
    example: /var/lib/loam/bodies
    description: "Directory holding the bodies, one file per content digest"
  spool_dir:
    type: string
    required: true
    example: /var/lib/loam/spool
    description: Directory streamed writes are spooled in until they commit

include:
  - stack: ../../stack/loam-node.yaml
    as: node
    params:
      mesh_roots: "${param:mesh_roots}"
      ns_wal: "${param:ns_wal}"
      obj_wal: "${param:obj_wal}"
      body_dir: "${param:body_dir}"
      spool_dir: "${param:spool_dir}"

modules:
  - name: http
    port: ${param:port}
    # The kernel owns TCP segmentation.
    host_tcp: 1
    # The route's body ceiling (1 TiB, in KiB): bodies stream to
    # `s3_serve` on credit and are never held whole; the object ceiling
    # a request meets is `s3_serve`'s.
    route_0_max_body_kib: 1073741824
    routes:
      - path: "/"
        app: true

  - name: s3_serve
    credentials: ${param:credentials}
    mesh_roots: ${param:mesh_roots}
    region: ${param:region}
    max_object_mib: ${param:max_object_mib}
    part_min_kib: ${param:part_min_kib}

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in
  # The exchange: `http` asks, `s3_serve` answers.
  - from: http.request_out
    to: s3_serve.request_in
  - from: s3_serve.response_out
    to: http.response_in
