# The loam-crypt-nbd service graph: an encrypted block device over a
# remote Loam volume. Fluxor's `crypt_block` encrypts on the node, and the
# node reaches Loam through Fluxor's own `tls` module under the node's
# certificate — so Loam holds only ciphertext.
#
#   nbd-client → nbd_serve → crypt_block → loam_volume
#                                            ⇅ admin wire (net_proto)
#                                         tls (client, node certificate)
#                                            ⇅ ciphertext
#                                         linux_net → a loam-admin node
#
# `loam_volume` dials the node itself and presents the capabilities in
# `capability` — a grant on the volume's root and one on the body plane —
# before anything else; the node binds the writer lease to this session's
# identity. The volume must already exist (`loam volume create`) with
# power-of-two extents of at most 32 KiB. Everything crypt_block writes
# to it — superblocks, journal, unit metadata, data — is ciphertext;
# Loam never sees a key or a plaintext byte.
#
# The node's certificate is checked against the host's trusted CAs
# (`FLUXOR_CA_BUNDLE` names another bundle). Linux attaches the export
# with `nbd-client <host> <port> /dev/nbd0` and puts its own filesystem
# on it. `crypt_key` names the key in the node's key vault.

target: linux

tick_us: 100

# loam_volume ⇄ tls ⇄ linux_net: request/answer cycles by construction.
scheduler:
  accept_cycles: true

platform:
  net: {}

params:
  port:
    type: integer
    default: 10809
    min: 1
    max: 65535
    description: TCP port the NBD export listens on
  admin:
    type: string
    required: true
    example: "storage.example:7443"
    description: "The volume's node: its admin plane, host:port"
  capability:
    type: string
    required: true
    example: /etc/loam/volume.cap
    description: "Capability file: one fxcap1. chain per line, covering the volume's key and the body plane"
  root:
    type: string
    required: true
    example: tenant
    description: "The volume's namespace root"
  path:
    type: string
    required: true
    example: /vols/db0
    description: "The volume's path under its root"
  lease_ttl_ms:
    type: integer
    default: 30000
    min: 1000
    max: 300000
    description: "The writer lease's time to live, milliseconds"
  cert:
    type: file
    required: true
    example: ../../samples/node.der
    description: "This node's certificate, DER"
  key:
    type: file
    required: true
    example: ../../samples/node.key.der
    description: "This node's private key, DER"
  crypt_key:
    type: string
    required: true
    example: loam-db0
    description: The key vault entry crypt_block encrypts the volume under

modules:
  - name: tls
    mode: 0                       # client
    peer_auth: ca_dns
    trust: system
    cert_file: "${param:cert}"
    key_file: "${param:key}"
  - name: loam_volume
    variant: node
    admin: "${param:admin}"
    capability: "${param:capability}"
    root: "${param:root}"
    path: "${param:path}"
    lease_ttl_ms: ${param:lease_ttl_ms}
    block_size: 512
  # The raw-device container (formats §2): superblocks, journal and unit
  # metadata live in the volume's blocks as ciphertext.
  - name: crypt_block
    key: "${param:crypt_key}"
    format: 1
    block_size: 512
    unit_size: 4096
    journal_units: 64
  - name: nbd_serve
    port: ${param:port}

wiring:
  - from: linux_net.net_out
    to: tls.cipher_in
  - from: tls.cipher_out
    to: linux_net.net_in
  - from: tls.clear_out
    to: loam_volume.admin_in
  - from: loam_volume.admin_out
    to: tls.clear_in

  - from: linux_net.net_out
    to: nbd_serve.net_in
  - from: nbd_serve.net_out
    to: linux_net.net_in

  - from: loam_volume.blocks
    to: crypt_block.lower
  - from: crypt_block.blocks
    to: nbd_serve.blocks
