[package]
name = "loam-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Loam Authors <eng@nanocloud.local>"]
description = "Host CLI and server daemon for Loam; links the loam library directly."

[[bin]]
name = "loam"
path = "src/main.rs"

[[bin]]
name = "loam-server"
path = "src/server.rs"

[[bin]]
name = "loam-nbd"
path = "src/nbd_main.rs"

[lints]
workspace = true

[dependencies]
# Not dev-only any more: `loam-nbd` is a shipped binary built on the
# client crate, which is exactly the consumer the client exists for.
loam-client = { path = "../loam-client" }
tempfile = "3.23.0"
anyhow = "1.0.95"
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
loam = { path = "../.." }

[dev-dependencies]
tempfile = "3.23.0"
