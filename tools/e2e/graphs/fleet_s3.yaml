# An S3 front over a two-member body fleet: the fleet gate's router graph.
#
#   linux_net ⇄ http ⇄ s3_serve ── storage.object ──▶ object_provider
#        ⇅ link 0 admin_gate ⇄ admin_router ⇄ namespace_router, object_index
#                                    ⇅ body plane
#                           body_fanout_router (replicas 2)
#              member 0 ⇄ remote_channel (dial) ⇄ tls ⇄ linux_net ⇄ loam-body A
#              member 1 ⇄ remote_channel (dial) ⇄ tls ⇄ linux_net ⇄ loam-body B
#
# Each member's channel carries body frames record for record over its own
# mutually authenticated session. tools/e2e/fleet.sh runs it with its
# params.
target: linux
tick_us: 100

scheduler:
  accept_cycles: true

platform:
  net: {}

params:
  port:
    type: integer
    required: true
    example: 9000
    min: 1
    max: 65535
    description: The S3 port
  credentials:
    type: string
    required: true
    example: /etc/loam/s3-credentials
    description: "The credentials file: access key, secret, scope and capability per line"
  mesh_roots:
    type: string
    required: true
    example: "3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c"
    description: The mesh root the capabilities verify against
  spool_dir:
    type: string
    required: true
    example: /var/lib/loam/spool
    description: Directory streamed writes are spooled in until they commit
  ns_wal:
    type: string
    required: true
    example: /var/lib/loam/ns.wal
    description: The namespace's write-ahead log
  obj_wal:
    type: string
    required: true
    example: /var/lib/loam/obj.wal
    description: The object index's write-ahead log
  ca:
    type: file
    required: true
    example: ../../../packaging/samples/ca.pem
    description: CA bundle the body nodes' certificates chain to
  cert:
    type: file
    required: true
    example: ../../../packaging/samples/node.der
    description: This router's client certificate, DER
  key:
    type: file
    required: true
    example: ../../../packaging/samples/node.key.der
    description: This router's private key, DER
  member_a:
    type: string
    required: true
    example: "localhost:7444"
    description: The first body node, host:port
  member_b:
    type: string
    required: true
    example: "localhost:7445"
    description: The second body node, host:port

modules:
  - name: http
    port: ${param:port}
    host_tcp: 1
    route_0_max_body_kib: 1073741824
    routes:
      - path: "/"
        app: true
  - name: s3_serve
    credentials: ${param:credentials}
    mesh_roots: ${param:mesh_roots}
    region: us-east-1
    max_object_mib: 64
    part_min_kib: 64
  - name: object_provider
    variant: node
    spool_dir: "${param:spool_dir}"
  - name: admin_gate
    variant: node
    mesh_roots: ${param:mesh_roots}
  - name: admin_router
    variant: node
  - name: namespace_router
    variant: node
    wal_path: "${param:ns_wal}"
  - name: object_index
    variant: node
    wal_path: "${param:obj_wal}"
  - name: body_fanout_router
    variant: node
    replicas: 2

  - name: tls_a
    type: tls
    mode: 0
    peer_auth: ca_dns
    trust: "${file:${param:ca}}"
    cert_file: "${param:cert}"
    key_file: "${param:key}"
  - name: rc_a
    type: remote_channel
    transport: net
    role: dial
    authority: "${param:member_a}"
    channels: "OctetStream:len32:61485"
  - name: tls_b
    type: tls
    mode: 0
    peer_auth: ca_dns
    trust: "${file:${param:ca}}"
    cert_file: "${param:cert}"
    key_file: "${param:key}"
  - name: rc_b
    type: remote_channel
    transport: net
    role: dial
    authority: "${param:member_b}"
    channels: "OctetStream:len32:61485"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in
  - from: http.request_out
    to: s3_serve.request_in
  - from: s3_serve.response_out
    to: http.response_in
  - from: object_provider.admin_out
    to: admin_gate.link0_in
    buffer_group: 3
  - from: admin_gate.link0_out
    to: object_provider.admin_in
    buffer_group: 4
  - from: admin_gate.admin_req
    to: admin_router.admin_in
    buffer_group: 5
  - from: admin_router.admin_out
    to: admin_gate.admin_resp
    buffer_group: 6
  - from: admin_router.ns_req
    to: namespace_router.requests
  - from: namespace_router.responses
    to: admin_router.ns_resp
  - from: admin_router.obj_req
    to: object_index.object_requests
    buffer_group: 7
  - from: object_index.object_responses
    to: admin_router.obj_resp
    buffer_group: 8
  - from: admin_router.body_req
    to: body_fanout_router.body_requests
  - from: body_fanout_router.body_responses
    to: admin_router.body_resp

  # Member A.
  - from: body_fanout_router.member0_req
    to: rc_a.ch0
  - from: rc_a.ch0_rx
    to: body_fanout_router.member0_resp
  - from: rc_a.transport_out
    to: tls_a.clear_in
  - from: tls_a.clear_out
    to: rc_a.transport_in
  - from: tls_a.peer_identity
    to: rc_a.peer_identity
  - from: tls_a.cipher_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: tls_a.cipher_in

  # Member B.
  - from: body_fanout_router.member1_req
    to: rc_b.ch0
  - from: rc_b.ch0_rx
    to: body_fanout_router.member1_resp
  - from: rc_b.transport_out
    to: tls_b.clear_in
  - from: tls_b.clear_out
    to: rc_b.transport_in
  - from: tls_b.peer_identity
    to: rc_b.peer_identity
  - from: tls_b.cipher_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: tls_b.cipher_in
