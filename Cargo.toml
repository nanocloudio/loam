[package]
name = "loam"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Loam Authors <eng@nanocloud.local>"]
description = "Loam — fluxor-native vocabulary crate for the loam PIC modules under modules/"

[workspace]
members = [".", "tools/loam-cli", "tools/loam-client"]
# Bare `cargo test`/`build` in the root dir covers the whole
# workspace (the root manifest is package+workspace, which would
# otherwise scope commands to the root package alone — and silently
# drop the loam-cli/loam-client suites from `fluxor ci`).
default-members = [".", "tools/loam-cli", "tools/loam-client"]

[workspace.package]
version = "0.0.1"

[workspace.lints.rust]
# `loam_profile` is loam's capacity-profile selector — an explicit
# input a build (or the fluxor pack step) sets, rather than the build
# target standing in for the deployment. Declared here so rustc checks
# the VALUES too: a `--cfg loam_profile="sever"` typo is then a build
# warning instead of a silent fall-through to the target default.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(loam_profile, values("minimal", "embedded", "node", "server"))',
] }

[workspace.lints.clippy]
# Loam's PIC discipline conflicts with these style lints by DESIGN:
# indexed loops keep bare-metal module builds panic-free (iterator
# adapters and slice copies pull core::panicking symbols the SDK
# doesn't stub — see modules/README.md), and bounded no_std step
# functions pass explicit scalar params rather than allocate
# context structs.
needless_range_loop = "allow"
manual_find = "allow"
too_many_arguments = "allow"
manual_flatten = "allow"
manual_memcpy = "allow"
manual_is_multiple_of = "allow"

[lints]
workspace = true

[lib]
name = "loam"
path = "src/lib.rs"

# This library is configuration vocabulary only — no runtime. Every
# piece of runtime logic lives in the PIC modules under `modules/`,
# and `tools/loam-cli/` drives those PIC bodies in-process.

[features]
default = ["std", "serde"]
std = []
# Activates the serde derives inside the mounted fluxor contracts source
# (src/lib.rs `#[path]` mount): its `cfg(feature = "serde")` gates evaluate
# against THIS crate's features. Default-on; loam itself uses serde
# unconditionally.
serde = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
toml = "0.8.19"

[dev-dependencies]
pretty_assertions = "1.4.0"
proptest = "1.5.0"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
