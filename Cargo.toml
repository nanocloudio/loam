[package]
name = "loam"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Loam Authors <eng@nanocloud.local>"]
description = "Loam — fluxor-native vocabulary crate for the loam PIC modules under modules/"

[workspace]
members = [".", "tools/loam-cli", "tools/loam-client"]
# Bare `cargo test`/`build` in the root dir covers the whole
# workspace (the root manifest is package+workspace, which would
# otherwise scope commands to the root package alone — and silently
# drop the loam-cli/loam-client suites from `fluxor ci`).
default-members = [".", "tools/loam-cli", "tools/loam-client"]

[workspace.package]
version = "0.0.1"

[workspace.lints.rust]
# The two cfgs the capacity-profile selector in loam_limits.rs reads.
#
# `loam_profile` is the explicit input a cargo build sets. Declaring its
# values means a misspelt value in SOURCE is a build warning. It does not
# check the command-line input: `--cfg loam_profile="sever"` compiles
# silently and selects `node`. The profile matrix, the one producer of
# that flag, passes each value as a literal from a fixed list.
#
# `fluxor_silicon` is the die fluxor's module build declares for every
# PIC compile. A cargo build never sets it, but the selector names it,
# so it is declared here with the one value loam maps.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(loam_profile, values("minimal", "embedded", "node", "server"))',
  'cfg(fluxor_silicon, values("bcm2712"))',
] }

[workspace.lints.clippy]
# Loam's PIC discipline conflicts with these style lints by DESIGN:
# indexed loops keep bare-metal module builds panic-free (iterator
# adapters and slice copies pull core::panicking symbols the SDK
# doesn't stub — see modules/README.md), and bounded no_std step
# functions pass explicit scalar params rather than allocate
# context structs.
needless_range_loop = "allow"
manual_find = "allow"
too_many_arguments = "allow"
manual_flatten = "allow"
manual_memcpy = "allow"
manual_is_multiple_of = "allow"

[lints]
workspace = true

[lib]
name = "loam"
path = "src/lib.rs"

# This library is configuration vocabulary only — no runtime. Every
# piece of runtime logic lives in the PIC modules under `modules/`,
# and `tools/loam-cli/` drives those PIC bodies in-process.

[features]
default = ["alloc", "serde"]
# Both features exist for the mounted fluxor contracts source (src/lib.rs
# `#[path]` mount): its `cfg(feature = "…")` gates evaluate against THIS
# crate's features, so loam declares exactly the ones it reads.
#
#   alloc — the owned vocabulary: `Fence`, `FenceWitness`, `HashAlgo` and
#           the log ring. Off, the prelude omits those three.
#   serde — the derives on every contract type.
alloc = []
serde = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
toml = "0.8.19"

[dev-dependencies]
pretty_assertions = "1.4.0"
proptest = "1.5.0"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
