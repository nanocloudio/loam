version = "0.1.0"
hardware_targets = ["bcm2712"]

# Channel-fronted append-only log: a consumer PIC gets durability over
# a request/response pair rather than through fs syscalls, so the
# backing storage can change without the consumer changing. The
# backing is the fluxor `fs` contract (FS_OPEN_CREATE / FS_WRITE /
# FS_FSYNC). The WAL-using PICs — namespace_router, object_index,
# block_allocator, raft_metadata_client — do not route through it;
# they include `wal_io.rs` directly (see docs/architecture.md).

[[ports]]
name = "log_requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "log_responses"
direction = "output"
content_type = "OctetStream"

[[resources]]
requires_contract = "fs"
access = "write"

[observability]
exempt = "in-arena state counters (ops/errors/scrub tallies) readable by the host harness; typed MSG_METRIC_SAMPLE emission is not wired yet"
