version = "0.1.0"
hardware_targets = ["bcm2712"]

# Deliberately NO `provides` claim: body_store is loam's INTERNAL
# content-addressed byte plane, reached through the body wire by the
# routers above it (body_fanout_router / ec_body_router) and composed
# behind `object_index`.
#
# `storage.object` is claimed by `object_provider`, which composes this
# plane's bytes with the namespace and the object index through the
# admin plane. Declaring it HERE would be wrong: this plane is keyed by
# digest and reached through the routers, and a second default provider
# of one contract in a graph is what the config gate rejects as silent
# shadowing. Fence class: LocalDurable (fsynced blobs); the replicated
# tier lifts this to ReplicatedDurable.

# Content-addressed object body store. Bodies are keyed by their
# SHA-256 digest; the PIC exposes channel-based put/get/head/
# delete (see modules/common/mechanics/loam_body_wire.rs). DISK-BACKED:
# bodies live at <root_dir>/<hex(sha256)>, the in-arena
# slot table is a cache/index, GET falls back to disk with digest
# verification (restart-safe), DELETE unlinks the file.

[[ports]]
name = "body_requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "body_responses"
direction = "output"
content_type = "OctetStream"

[[resources]]
requires_contract = "fs"
access = "write"

[observability]
exempt = "in-arena state counters (ops/errors/scrub tallies) readable by the host harness; typed MSG_METRIC_SAMPLE emission is not wired yet"

# Capacity profiles (modules/common/mechanics/loam_limits.rs). A graph
# picks one with `variant: <profile>`; the default is the bare-metal
# budget a Pi 5 / CM5 affords.
[[variant]]
name = "embedded"
features = ["embedded"]
default = true

[[variant]]
name = "minimal"
features = ["minimal"]

[[variant]]
name = "node"
features = ["node"]

[[variant]]
name = "server"
features = ["server"]
