version = "0.1.0"
hardware_targets = ["bcm2712"]

# Canonical storage surface this module provides (fluxor
# storage_capability_surface.md; declared per
# rfc_storage_capability_symmetry §4/§6 phase 4). Consumers reach it
# by naming the ports below — the documented channel-provider path.
# Honest fence class: LocalDurable (WAL-backed volume metadata).
provides = ["storage.block"]

[[ports]]
name = "block_requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "io_plans"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "block_responses"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"


[[resources]]
requires_contract = "fs"
access = "write"

[observability]
exempt = "in-arena state counters (ops/errors/scrub tallies) readable by the host harness; typed MSG_METRIC_SAMPLE emission is tracked RFC 0004 polish"
