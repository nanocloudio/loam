version = "0.1.0"
hardware_targets = ["bcm2712"]

# Deliberately NO `provides` claim.
#
# That surface is not loam's. `storage.block` is RAW BLOCK I/O — fluxor's `sd`, `nvme`
# and `flash_rp` providers offer it and `fat32` consumes it. What this
# module does is volume ACCOUNTING: create a volume, track its
# allocation high-water mark, release. That is metadata about block
# storage, not a block device, and no consumer that resolved
# `storage.block` by contract would find what it came for.
#
# Loam's actual block data path is the volume map — fixed-size
# extents as content-addressed bodies under a copy-on-write map
# (`common/mechanics/loam_volume_map_wire.rs`), committed by a
# namespace bind and replicated by the fan-out router like any other
# body. This module is not on that path. Honest fence class: LocalDurable (WAL-backed volume
# metadata).

[[ports]]
name = "block_requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "io_plans"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "block_responses"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"


[[resources]]
requires_contract = "fs"
access = "write"

[observability]
exempt = "in-arena state counters (ops/errors/scrub tallies) readable by the host harness; typed MSG_METRIC_SAMPLE emission is not wired yet"

# Capacity profiles (modules/common/mechanics/loam_limits.rs). A graph
# picks one with `variant: <profile>`; the default is the bare-metal
# budget a Pi 5 / CM5 affords.
[[variant]]
name = "embedded"
features = ["embedded"]
default = true

[[variant]]
name = "minimal"
features = ["minimal"]

[[variant]]
name = "node"
features = ["node"]

[[variant]]
name = "server"
features = ["server"]
