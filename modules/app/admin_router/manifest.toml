version = "0.1.0"
hardware_targets = ["bcm2712"]

# Front-door admin router. Translates external admin requests
# (loam_admin_wire format) into the public-surface PICs' native
# channel formats, and routes responses back tagged with the
# caller's correlation_id.
#
# Port order: admin_in first (inbound), then admin_out (slot-0
# output → reply channel), then the downstream namespace pair.
# `module_new` receives only the slot-0 in_chan / out_chan pair,
# so the remaining channels are resolved by explicit
# `dev_channel_port` lookup or by graph-side wiring overrides.

[[ports]]
name = "admin_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "admin_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ns_req"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ns_resp"
direction = "input"
content_type = "OctetStream"

[observability]
exempt = "in-arena state counters (ops/errors/scrub tallies) readable by the host harness; typed MSG_METRIC_SAMPLE emission is not wired yet"
