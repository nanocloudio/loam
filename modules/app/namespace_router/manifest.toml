version = "0.1.0"
hardware_targets = ["bcm2712", "linux"]

# Canonical storage surface this module provides (fluxor
# storage_capability_surface.md). Consumers reach it by naming the
# ports below — the documented channel-provider path.
# Honest fence class: ReplicatedDurable (via raft_metadata_client) or LocalDurable (WAL-only single node).
# The channel wire (common/mechanics/loam_wire.rs OP_BIND/OP_RENAME/OP_UNBIND/OP_LOOKUP) carries the same operation set as the canonical namespace contract (fluxor namespace.rs BIND 0x1308 / RENAME / DELETE / LOOKUP); the fused single-round-trip forms are equivalent per the OPEN_CREATE ≡ BIND + OPEN rule.
provides = ["storage.namespace"]

# Port order matters for the PIC ABI's slot-0 convention:
# `module_new(in_chan, out_chan, …)` receives the FIRST declared output
# as `out_chan`. namespace_pic_body writes 1-byte ack/nak frames to
# `out_chan`, so `responses` must be the first output. The other two
# outputs are accessed by name from the wiring resolver in production
# configs and stay unwired in the throughput probe.
[[ports]]
name = "requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "committed"
direction = "input"
content_type = "OctetStream"
# loam_decision_wire Committed records from raft_metadata_client
# (replicated mode); unwired in single-node profiles.

[[ports]]
name = "responses"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metadata_ops"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"


[[resources]]
requires_contract = "fs"
access = "write"

# Subscription records come from the module's heap, a page at a time,
# never from a preallocated table: every instance's heap is its declared
# arena (`base`, `SUB_ARENA_BASE` in namespace_pic_body.rs: two pages)
# plus `bytes_each` (`SUB_RECORD_HEAP_BYTES`, one record's share of a
# page) per subscription the graph plans for `store_subs`. A spent heap
# is SUBSCRIBE's counted ENOMEM. `namespace_provider.rs` holds both
# figures to the source.
[capacities]
heap_per_demand = { pool = "store_subs", bytes_each = 289, base = 9248 }

[observability]
exempt = "in-arena state counters (ops/errors/scrub tallies) readable by the host harness; typed MSG_METRIC_SAMPLE emission is not wired yet"

# Capacity profiles (modules/common/mechanics/loam_limits.rs). A graph
# picks one with `variant: <profile>`; the default is the bare-metal
# budget a Pi 5 / CM5 affords.
[[variant]]
name = "embedded"
features = ["embedded"]
default = true

[[variant]]
name = "minimal"
features = ["minimal"]

[[variant]]
name = "node"
features = ["node"]

[[variant]]
name = "server"
features = ["server"]
