version = "0.1.0"
hardware_targets = ["bcm2712"]
# A grant's window is checked against the kernel's trusted clock; a
# request's deadline against the monotonic one.
timer_class = "wall_clock"

# Loam's `storage.object` (modules/common/mechanics/object_provider_body.rs):
# the canonical object surface, answered from the admin plane. A
# consumer presents a capability for a scope; the provider opens a
# session for it on an `admin_gate` link, and every operation runs under
# the grant that session holds. Keys are `root/path`. Writes are the
# admin plane's composed, conditional writes; reads pin to the object
# they resolved. Fence: `Volatile` — the admin plane's answers carry no
# fence, so the provider claims none. With a `volume:` parameter it is a
# keyed provider (reached by that volume's selector), leaving the graph's
# default `storage.object` to another; without one it is the default.
provides = ["storage.object"]

[[ports]]
name = "admin_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 131072
# ← admin_gate.link{i}_out: `[session:u32][answer]` records, one per buffer.

[[ports]]
name = "admin_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 131072
# → admin_gate.link{i}_in: `[session:u32][frame]` records, one per buffer.

[[resources]]
requires_contract = "fs"
access = "write"
# Streamed writes spool under `spool_dir` until they commit.

[observability]
exempt = "a provider answered inside its consumers' steps; request, answer and expiry counters are in-arena and readable by the host harness"

[[variant]]
name = "embedded"
features = ["embedded"]
default = true

[[variant]]
name = "minimal"
features = ["minimal"]

[[variant]]
name = "node"
features = ["node"]

[[variant]]
name = "server"
features = ["server"]
