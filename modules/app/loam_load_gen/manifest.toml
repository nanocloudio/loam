version = "0.1.0"
hardware_targets = ["bcm2712"]

[[ports]]
name = "ops"
direction = "output"
content_type = "OctetStream"

[observability]
exempt = "diagnostic load injector; drives offered load, not data-plane telemetry"

# Capacity profiles (modules/common/mechanics/loam_limits.rs). A graph
# picks one with `variant: <profile>`; the default is the bare-metal
# budget a Pi 5 / CM5 affords.
[[variant]]
name = "embedded"
features = ["embedded"]
default = true

[[variant]]
name = "minimal"
features = ["minimal"]

[[variant]]
name = "node"
features = ["node"]

[[variant]]
name = "server"
features = ["server"]
